services:
  - type: web
    name: industrial-fire-detection-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: REFRESH_ENABLED
        sync: false
      - key: REFRESH_MINUTES
        sync: false
