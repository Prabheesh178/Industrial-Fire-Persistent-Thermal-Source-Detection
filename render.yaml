services:
  - type: web
    name: industrial-fire-detection-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: LIVE_FIRMS_POLL
        value: "false"
      - key: DEFAULT_REGION
        value: "gujarat"

